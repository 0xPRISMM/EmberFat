name: Windows VST3 release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build VST3 and Windows installer
        id: package
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/package-windows.ps1 -SourceRevision $env:SOURCE_REVISION
      - name: Upload VST3, installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: EmberFat-Windows-${{ steps.package.outputs.version }}-${{ github.run_number }}
          path: |
            dist/EmberFat.vst3
            dist/EmberFat-Windows-Setup.exe
            dist/SHA256SUMS.txt
            dist/BUILD.txt
          if-no-files-found: error
          retention-days: 30
